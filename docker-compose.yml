services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      ELASTIC_HOST: elasticsearch
    depends_on:
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

  theatre-db:
    image: postgres:16
    env_file:
      - .env
    volumes:
      - ./database_dump.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d theatre"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  etl:
    build: ./postgres_to_es
    env_file:
      - .env
    environment:
      DB_HOST: theatre-db
      ES_HOST: elasticsearch
      STATE_FILE_PATH: /opt/app/state/state.json
    volumes:
      - etl_state:/opt/app/state
    depends_on:
      theatre-db:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  es_data:
  etl_state:
